name: Solcon Media3 RTP Dev

on:
  push:
    branches:
      - feat/solcon-tv
  workflow_dispatch:

permissions:
  contents: read

env:
  GITHUB_ACTOR: ${{ github.actor }}
  GPR_TOKEN: ${{ secrets.GPR_TOKEN }}

concurrency:
  group: solcon-media3-rtp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve core
        uses: ./.github/actions/resolve-core

      - name: Unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew testStandardDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew lintStandardDebug --stacktrace

      - name: Build standard debug APK
        run: ./gradlew assembleStandardDebug --stacktrace

      - name: Stage APK
        run: |
          mkdir -p dist
          SRC=$(ls app/build/outputs/apk/standard/debug/*.apk | head -n1)
          cp "$SRC" dist/MyOwnTV-Solcon-Media3.apk
          sha256sum dist/MyOwnTV-Solcon-Media3.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyOwnTV-Solcon-Media3
          path: dist/MyOwnTV-Solcon-Media3.apk
          if-no-files-found: error
