name: Solcon Provider-Managed Source Patch

on:
  workflow_dispatch:
  push:
    branches: [feat/solcon-tv]
    paths:
      - 'tools/solcon/apply_manage_source_fix.py'
      - '.github/workflows/solcon-manage-source-patch.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'joppealting-sudo/MyOwnTV'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/solcon-tv
          fetch-depth: 0
      - name: Apply provider-managed source integration
        run: python tools/solcon/apply_manage_source_fix.py
      - name: Verify patch shape
        run: |
          git diff --check
          changed="$(git diff --name-only | sort | tr '\n' ' ')"
          test "$changed" = 'app/src/main/java/tv/own/owntv/features/settings/ManageSourcesScreen.kt app/src/main/res/values/strings_solcon.xml '
          git diff -- app/src/main/java/tv/own/owntv/features/settings/ManageSourcesScreen.kt app/src/main/res/values/strings_solcon.xml
      - name: Commit integration
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/tv/own/owntv/features/settings/ManageSourcesScreen.kt app/src/main/res/values/strings_solcon.xml
          git commit -m 'feat: keep Solcon source management provider-aware'
          git push origin HEAD:feat/solcon-tv
