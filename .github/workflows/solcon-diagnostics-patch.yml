name: Solcon Safe Diagnostics Patch

on:
  workflow_dispatch:
  push:
    branches: [feat/solcon-tv]
    paths:
      - 'tools/solcon/apply_safe_diagnostics.py'
      - '.github/workflows/solcon-diagnostics-patch.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'joppealting-sudo/MyOwnTV'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/solcon-tv
          fetch-depth: 0
      - name: Apply safe diagnostics integration
        run: python tools/solcon/apply_safe_diagnostics.py
      - name: Verify patch shape
        run: |
          git diff --check
          git diff -- app/src/main/java app/src/main/res/values/strings_solcon.xml tools/solcon/classify_solcon_protocol_literals.py
      - name: Commit integration
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java app/src/main/res/values/strings_solcon.xml tools/solcon/classify_solcon_protocol_literals.py
          git commit -m 'feat: add safe Solcon diagnostics and playback errors'
          git push origin HEAD:feat/solcon-tv
