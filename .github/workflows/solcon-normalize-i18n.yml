name: Normalize Solcon i18n Inventory

on:
  workflow_dispatch:
  push:
    branches: [feat/solcon-tv]
    paths:
      - '.github/workflows/solcon-normalize-i18n.yml'

permissions:
  contents: write

jobs:
  normalize:
    if: github.repository == 'joppealting-sudo/MyOwnTV'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/solcon-tv
          fetch-depth: 0
      - name: Restore debt baseline from main
        run: git show origin/main:tools/i18n/hardcoded_baseline.txt > tools/i18n/hardcoded_baseline.txt
      - name: Classify reviewed Solcon implementation literals
        run: python tools/solcon/classify_solcon_protocol_literals.py
      - name: Classify exact developer-only playback logs
        run: |
          python tools/i18n/check_hardcoded_strings.py classify-safe \
            --path app/src/main/java/tv/own/owntv/features/live/LiveViewModel.kt \
            --text 'Solcon TV+ playback unavailable (${resolved.category.name})' \
            --category log
          python tools/i18n/check_hardcoded_strings.py classify-safe \
            --path app/src/main/java/tv/own/owntv/features/live/LiveViewModel.kt \
            --text 'Solcon TV+ playback failed (${resolved.category.name})' \
            --category log
      - name: Prove merge-base ratchet
        run: |
          base_sha="$(git merge-base HEAD origin/main)"
          python tools/i18n/check_hardcoded_strings.py verify-ci --base-sha "$base_sha"
      - name: Verify only i18n inventory changed
        run: |
          git diff --check
          changed="$(git diff --name-only | sort | tr '\n' ' ')"
          test "$changed" = 'tools/i18n/hardcoded_baseline.txt tools/i18n/safe_literals.txt '
          git diff -- tools/i18n/hardcoded_baseline.txt tools/i18n/safe_literals.txt
      - name: Commit normalized inventory
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/i18n/hardcoded_baseline.txt tools/i18n/safe_literals.txt
          git commit -m 'chore: normalize Solcon i18n classifications'
          git push origin HEAD:feat/solcon-tv
