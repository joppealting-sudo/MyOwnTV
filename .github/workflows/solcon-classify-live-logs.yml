name: Solcon Playback Log Classification

on:
  workflow_dispatch:
  push:
    branches: [feat/solcon-tv]
    paths:
      - '.github/workflows/solcon-classify-live-logs.yml'

permissions:
  contents: write

jobs:
  classify:
    if: github.repository == 'joppealting-sudo/MyOwnTV'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/solcon-tv
          fetch-depth: 0
      - name: Classify exact developer-only log literals
        run: |
          python tools/i18n/check_hardcoded_strings.py classify-safe \
            --path app/src/main/java/tv/own/owntv/features/live/LiveViewModel.kt \
            --text 'Solcon TV+ playback unavailable (${resolved.category.name})' \
            --category log
          python tools/i18n/check_hardcoded_strings.py classify-safe \
            --path app/src/main/java/tv/own/owntv/features/live/LiveViewModel.kt \
            --text 'Solcon TV+ playback failed (${resolved.category.name})' \
            --category log
      - name: Verify only i18n inventory changed
        run: |
          git diff --check
          git diff -- tools/i18n/safe_literals.txt tools/i18n/hardcoded_baseline.txt
          changed="$(git diff --name-only | sort | tr '\n' ' ')"
          test "$changed" = 'tools/i18n/hardcoded_baseline.txt tools/i18n/safe_literals.txt '
      - name: Commit classification
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/i18n/safe_literals.txt tools/i18n/hardcoded_baseline.txt
          git commit -m 'chore: classify Solcon playback diagnostics as logs'
          git push origin HEAD:feat/solcon-tv
