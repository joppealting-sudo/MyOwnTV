name: Solcon Integration Patcher

on:
  push:
    branches:
      - feat/solcon-tv
    paths:
      - 'tools/solcon/apply_multicast_integration.py'
      - '.github/workflows/solcon-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/solcon-tv
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply deterministic source patch
        run: python tools/solcon/apply_multicast_integration.py
      - name: Validate patch
        run: |
          git diff --check
          git diff --exit-code -- tools/solcon/apply_multicast_integration.py .github/workflows/solcon-patch.yml || true
      - name: Commit patched sources
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add app/src/main/java
          git commit -m 'feat: integrate Media3 multicast into live playback'
          git push origin HEAD:feat/solcon-tv
