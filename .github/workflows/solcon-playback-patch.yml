name: Solcon Active Source and Playback Patch

on:
  workflow_dispatch:
  push:
    branches: [feat/solcon-tv]
    paths:
      - 'tools/solcon/apply_active_source_and_playback.py'
      - '.github/workflows/solcon-playback-patch.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'joppealting-sudo/MyOwnTV'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/solcon-tv
          fetch-depth: 0
      - name: Apply active-source and playback integration
        run: python tools/solcon/apply_active_source_and_playback.py
      - name: Verify patch shape
        run: |
          git diff --check
          git diff -- app/src/main/java
      - name: Commit integration
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java
          git commit -m 'feat: activate and resolve Solcon TV+ playback'
          git push origin HEAD:feat/solcon-tv
