name: PR APK

# Fork-only: an installable APK for every pull request, so a change can be tried on the TV before it is
# merged. (Upstream builds APKs only from main and tags; Android CI still gates tests and lint here.)
#
# Signing: with the KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD secrets set — the same
# ones android.yml uses — this builds a signed release APK whose signature never changes, so each new one
# installs over the last and keeps its data. Without them it builds a debug APK, whose throwaway CI key
# differs per run: installing a newer one then means uninstalling the older one first.

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore (if configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          fi

      - name: Build the APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # The PR's own commit, not the temporary merge commit GITHUB_SHA names on pull_request.
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          chmod +x ./gradlew
          if [ -n "${KEYSTORE_FILE:-}" ]; then
            ./gradlew :app:assembleStandardRelease --console=plain
            SRC=$(ls app/build/outputs/apk/standard/release/*.apk | head -n1)
          else
            ./gradlew :app:assembleStandardDebug --console=plain
            SRC=$(ls app/build/outputs/apk/standard/debug/*.apk | head -n1)
          fi
          mkdir -p dist
          OUT="MyOwnTV-pr${PR_NUMBER:-manual}-${HEAD_SHA::7}.apk"
          cp "$SRC" "dist/$OUT"
          sha256sum "dist/$OUT"
          echo "APK_OUT=$OUT" >> "$GITHUB_ENV"

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_OUT }}
          path: dist/${{ env.APK_OUT }}
          if-no-files-found: error
          retention-days: 14
