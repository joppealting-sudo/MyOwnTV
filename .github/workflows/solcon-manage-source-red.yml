name: Solcon Manage Source RED

on:
  workflow_dispatch:
  push:
    branches: [feat/solcon-tv]
    paths:
      - '.github/workflows/solcon-manage-source-red.yml'

permissions:
  contents: read

env:
  GITHUB_ACTOR: ${{ github.actor }}
  GPR_TOKEN: ${{ secrets.GPR_TOKEN }}

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
      - uses: ./.github/actions/resolve-core
      - name: Run targeted Solcon wiring test
        run: ./gradlew testStandardDebugUnitTest --tests 'tv.own.owntv.provider.solcon.SolconEndToEndWiringTest' --stacktrace
